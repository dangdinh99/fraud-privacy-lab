# FINAL test-set evaluation (run once with --final). Identical to configs/report_lgbm.yaml except
# eval_split: test. Settings and seeds frozen in docs/decisions.md; results are reported as is.
name: final_lgbm
stage: final
data_dir: data/raw/ieee-cis
split_dir: data/splits
features_config: configs/features.yaml
eval_split: test
budgets: [0.01, 0.005, 0.02]
select_budgets: [0.01, 0.02]
ece_bins: 10
device: cpu
seeds: [10, 11, 12]
model:
  type: lightgbm
  params: {learning_rate: 0.05, min_child_samples: 100, feature_fraction: 0.5, bagging_fraction: 0.8,
    bagging_freq: 1, num_threads: 8, max_rounds: 3000, early_stopping_rounds: 100,
    num_leaves: 127}
