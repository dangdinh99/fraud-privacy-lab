# Stage 1: extension of the non-private MLP grid around the first winner (lr 3e-4,
# 10 epochs, at the corner of the first grid). Same everything else; see docs/decisions.md.
name: baseline_mlp_ext
stage: stage1
data_dir: data/raw/ieee-cis
split_dir: data/splits
features_config: configs/features.yaml
eval_split: val          # test only with --final
seeds: [0, 1, 2]
budgets: [0.01, 0.005, 0.02]
select_budgets: [0.01, 0.02]   # co-primary; ranked by mean share of ceiling over both
ece_bins: 10

model:
  type: mlp
  params:
    hidden: [128, 64]
    batch_size: 1024     # expected size under Poisson sampling
    weight_decay: 0.0

grid:
  lr: [0.0003, 0.0001]
  epochs: [10, 20]
