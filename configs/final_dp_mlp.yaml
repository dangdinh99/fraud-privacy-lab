# FINAL test-set evaluation (run once with --final). Identical to configs/report_dp_mlp.yaml except
# eval_split: test. Settings and seeds frozen in docs/decisions.md; results are reported as is.
name: final_dp_mlp
stage: final
data_dir: data/raw/ieee-cis
split_dir: data/splits
features_config: configs/features.yaml
eval_split: test
budgets: [0.01, 0.005, 0.02]
select_budgets: [0.01, 0.02]
ece_bins: 10
device: cuda
seeds: [10, 11, 12]
model:
  type: dp_mlp
  params:
    hidden: [128, 64]
    weight_decay: 0.0
    delta: 1.0e-06
    batch_size: 1024
points:
- {target_epsilon: 0.5, max_grad_norm: 0.2, lr: 0.003, epochs: 10}
- {target_epsilon: 1, max_grad_norm: 0.05, lr: 0.003, epochs: 20}
- {target_epsilon: 2, max_grad_norm: 0.2, lr: 0.003, epochs: 20}
- {target_epsilon: 4, max_grad_norm: 0.05, lr: 0.003, epochs: 20}
- {target_epsilon: 8, max_grad_norm: 1.0, lr: 0.003, epochs: 20}
