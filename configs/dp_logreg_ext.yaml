# Stage 2 step 1 extension: the best DP settings sat at the grid corner (highest lr,
# most epochs, and for logistic regression the largest clipping norm), so the search
# continues beyond it at batch 1,024. Seed 0. See docs/decisions.md.
name: dp_logreg_ext
stage: stage2
data_dir: data/raw/ieee-cis
split_dir: data/splits
features_config: configs/features.yaml
eval_split: val
budgets: [0.01, 0.005, 0.02]
select_budgets: [0.01, 0.02]
ece_bins: 10
device: cuda
seeds: [0]
model:
  type: dp_logreg
  params:
    hidden: []
    weight_decay: 0.0
    delta: 1.0e-06
    batch_size: 1024
points:
- {target_epsilon: 0.5, max_grad_norm: 1.0, lr: 0.003, epochs: 20}
- {target_epsilon: 0.5, max_grad_norm: 1.0, lr: 0.01, epochs: 10}
