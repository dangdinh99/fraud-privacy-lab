# Stage 2 final search round, logistic regression only: after the first extension its best
# settings were still at the largest clipping norm and epoch count, with gains above seed
# noise. Last round by the stopping rule in docs/decisions.md. Points already run are skipped.
name: dp_logreg_ext2
stage: stage2
data_dir: data/raw/ieee-cis
split_dir: data/splits
features_config: configs/features.yaml
eval_split: val
budgets: [0.01, 0.005, 0.02]
select_budgets: [0.01, 0.02]
ece_bins: 10
device: cuda
seeds: [0]
model:
  type: dp_logreg
  params:
    hidden: []
    weight_decay: 0.0
    delta: 1.0e-06
    batch_size: 1024
points:
- {target_epsilon: 0.5, max_grad_norm: 5.0, lr: 0.003, epochs: 40}
- {target_epsilon: 0.5, max_grad_norm: 5.0, lr: 0.01, epochs: 40}
