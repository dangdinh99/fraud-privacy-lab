config:
  name: report_mlp
  stage: stage2
  data_dir: data/raw/ieee-cis
  split_dir: data/splits
  features_config: configs/features.yaml
  eval_split: val
  budgets:
  - 0.01
  - 0.005
  - 0.02
  select_budgets:
  - 0.01
  - 0.02
  ece_bins: 10
  device: cuda
  seeds:
  - 10
  - 11
  - 12
  model:
    type: mlp
    params:
      hidden:
      - 128
      - 64
      weight_decay: 0.0
      batch_size: 1024
      lr: 0.0003
      epochs: 10
features:
  exclude:
  - TransactionID
  - TransactionDT
  - isFraud
  - split
  max_missing_rate: 0.9
  prune_prefix: V
  prune_corr: 0.95
  log1p_columns:
  - TransactionAmt
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  - C7
  - C8
  - C9
  - C10
  - C11
  - C12
  - C13
  - C14
  clip_sd: 5.0
  categorical:
  - ProductCD
  - card1
  - card2
  - card3
  - card4
  - card5
  - card6
  - addr1
  - addr2
  - P_emaildomain
  - R_emaildomain
  - M1
  - M2
  - M3
  - M4
  - M5
  - M6
  - M7
  - M8
  - M9
  - DeviceType
  - DeviceInfo
  - id_12
  - id_13
  - id_14
  - id_15
  - id_16
  - id_17
  - id_18
  - id_19
  - id_20
  - id_21
  - id_22
  - id_23
  - id_24
  - id_25
  - id_26
  - id_27
  - id_28
  - id_29
  - id_30
  - id_31
  - id_32
  - id_33
  - id_34
  - id_35
  - id_36
  - id_37
  - id_38
  onehot_min_freq: 0.01
  frequency_columns:
  - card1
  - card2
  - addr1
  - DeviceInfo
  hour_of_day: true
final: false
only: {}
